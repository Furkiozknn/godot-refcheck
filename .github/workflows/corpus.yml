name: Corpus

# The corpus clones real Godot repositories, so it runs on demand and once a
# week rather than on every push. A finding that appears here is either a real
# defect upstream or a false positive that has to be fixed.
on:
  workflow_dispatch:
  schedule:
    - cron: "40 4 * * 1"

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release
      - name: Scan the corpus
        run: |
          set -eo pipefail
          python3 tools/corpus.py | tee corpus.txt
      - name: Break a real project and repair it again
        run: |
          set -eo pipefail
          demo=target/corpus/godot-demo-projects/2d/dodge_the_creeps
          python3 tools/verify_with_godot.py --download --real "$demo" | tee repair.txt
      - name: Publish the table
        run: |
          {
            echo "### Corpus"
            echo ""
            echo '```'
            cat corpus.txt
            echo '```'
            echo ""
            echo "### Engine agreement and repair"
            echo ""
            echo '```'
            cat repair.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
