<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="godot-refcheck - find broken resource references in a Godot project">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11161d"/>
      <stop offset="100%" stop-color="#1b2430"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f9cd8"/>
      <stop offset="100%" stop-color="#6fd3c2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="80" y="128" font-size="52" fill="#e8eef5" font-weight="700">godot-refcheck</text>
    <text x="80" y="176" font-size="24" fill="#93a4b8">broken resource references, found before the build is</text>
    <text x="80" y="208" font-size="24" fill="#93a4b8">on someone else's machine</text>

    <g transform="translate(80,258)" font-size="19">
      <text x="0" y="0" fill="#7f8ea3">cave.tscn:7:</text>
      <text x="150" y="0" fill="#f2766b">error</text>
      <text x="215" y="0" fill="#c9d6e4">missing-resource  res://art/wall_02.png</text>
      <text x="0" y="34" fill="#7f8ea3">hud.tscn:4:</text>
      <text x="150" y="34" fill="#f2766b">error</text>
      <text x="215" y="34" fill="#c9d6e4">case-mismatch     res://Art/heart.png</text>
      <text x="0" y="68" fill="#7f8ea3">player.gd:12:</text>
      <text x="150" y="68" fill="#e8b765">warn</text>
      <text x="215" y="68" fill="#c9d6e4">stale-import      dash.png.import</text>
    </g>
  </g>
  <g transform="translate(860,140)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="url(#ok)" stroke-width="4"/>
    <circle cx="150" cy="0" r="14" fill="none" stroke="url(#ok)" stroke-width="4"/>
    <path d="M14 0 L64 0" stroke="url(#ok)" stroke-width="4" stroke-linecap="round"/>
    <path d="M86 0 L136 0" stroke="url(#ok)" stroke-width="4" stroke-linecap="round"/>
    <path d="M68 -14 L82 14 M82 -14 L68 14" stroke="#f2766b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="75" cy="60" r="14" fill="none" stroke="url(#ok)" stroke-width="4"/>
    <path d="M0 14 L0 46 L61 60" stroke="url(#ok)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M150 14 L150 46 L89 60" stroke="url(#ok)" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <rect x="0" y="392" width="1200" height="8" fill="url(#ok)"/>
</svg>
