name: godot-refcheck
description: Find broken resource references, UID problems and dead assets in a Godot project.
author: Furkiozknn
branding:
  icon: link-2
  color: blue

inputs:
  path:
    description: Project directory, a project.godot file, or a directory of projects with recursive.
    required: false
    default: "."
  recursive:
    description: Scan every project.godot found under path.
    required: false
    default: "false"
  unused:
    description: Also report assets nothing appears to reference.
    required: false
    default: "false"
  only:
    description: Comma separated list of checks to run on their own.
    required: false
    default: ""
  skip:
    description: Comma separated list of checks to skip.
    required: false
    default: ""
  fail-on:
    description: "Fail the step at this level or above: error, warning, info, never."
    required: false
    default: "error"
  sarif:
    description: Write a SARIF 2.1.0 report to this file.
    required: false
    default: ""
  fix:
    description: Repair in place every reference that can be proved, then report what is left.
    required: false
    default: "false"
  fix-dry-run:
    description: Show those repairs without changing a file.
    required: false
    default: "false"
  baseline:
    description: Path to a baseline file whose findings should be ignored.
    required: false
    default: ""
  version:
    description: Release to use. Defaults to the version of the action itself.
    required: false
    default: ""

outputs:
  errors:
    description: Number of findings at error level.
    value: ${{ steps.run.outputs.errors }}
  warnings:
    description: Number of findings at warning level.
    value: ${{ steps.run.outputs.warnings }}
  notes:
    description: Number of findings at note level.
    value: ${{ steps.run.outputs.notes }}
  findings:
    description: Total number of findings.
    value: ${{ steps.run.outputs.findings }}
  repaired:
    description: Number of references repaired, when fix is on.
    value: ${{ steps.run.outputs.repaired }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      run: |
        set -eu
        version="${{ inputs.version }}"
        if [ -z "$version" ]; then
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' "$GITHUB_ACTION_PATH/Cargo.toml" | head -n 1)"
        fi
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   target="x86_64-unknown-linux-gnu"; ext="tar.gz" ;;
          Linux-ARM64) target="aarch64-unknown-linux-gnu"; ext="tar.gz" ;;
          macOS-X64)   target="x86_64-apple-darwin"; ext="tar.gz" ;;
          macOS-ARM64) target="aarch64-apple-darwin"; ext="tar.gz" ;;
          Windows-X64) target="x86_64-pc-windows-msvc"; ext="zip" ;;
          *)           target=""; ext="" ;;
        esac
        dir="${RUNNER_TEMP}/godot-refcheck"
        mkdir -p "$dir"
        binary="$dir/godot-refcheck"
        if [ "${RUNNER_OS}" = "Windows" ]; then
          binary="$dir/godot-refcheck.exe"
        fi
        ok="no"
        if [ -n "$target" ]; then
          asset="godot-refcheck-v${version}-${target}.${ext}"
          url="https://github.com/Furkiozknn/godot-refcheck/releases/download/v${version}/${asset}"
          echo "trying $url"
          if curl -fsSL -o "$dir/$asset" "$url"; then
            if [ "$ext" = "zip" ]; then
              unzip -o -q "$dir/$asset" -d "$dir"
            else
              tar -xzf "$dir/$asset" -C "$dir"
            fi
            if [ -f "$binary" ]; then
              chmod +x "$binary"
              ok="yes"
            fi
          fi
        fi
        if [ "$ok" = "no" ]; then
          echo "no published binary for ${RUNNER_OS}-${RUNNER_ARCH} at v${version}; building from source"
          cargo build --release --manifest-path "$GITHUB_ACTION_PATH/Cargo.toml"
          built="$GITHUB_ACTION_PATH/target/release/godot-refcheck"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            built="$GITHUB_ACTION_PATH/target/release/godot-refcheck.exe"
          fi
          cp "$built" "$binary"
        fi
        "$binary" --version
        echo "binary=$binary" >> "$GITHUB_OUTPUT"

    - id: run
      shell: bash
      run: |
        set -u
        binary='${{ steps.install.outputs.binary }}'
        args=""
        if [ '${{ inputs.recursive }}' = 'true' ]; then
          args="$args --recursive"
        fi
        if [ '${{ inputs.unused }}' = 'true' ]; then
          args="$args --unused"
        fi
        if [ -n '${{ inputs.only }}' ]; then
          args="$args --only ${{ inputs.only }}"
        fi
        if [ -n '${{ inputs.skip }}' ]; then
          args="$args --skip ${{ inputs.skip }}"
        fi
        if [ -n '${{ inputs.sarif }}' ]; then
          args="$args --sarif ${{ inputs.sarif }}"
        fi
        if [ '${{ inputs.fix }}' = 'true' ]; then
          args="$args --fix"
        fi
        if [ '${{ inputs.fix-dry-run }}' = 'true' ]; then
          args="$args --fix-dry-run"
        fi
        if [ -n '${{ inputs.baseline }}' ]; then
          args="$args --baseline ${{ inputs.baseline }}"
        fi

        # Two passes, both of which refuse to fail: the text one is what a
        # person reads in the step summary, the JSON one is what the counts
        # come from. The counts used to be scraped out of the text, which
        # worked only when there was something to report - a single clean
        # project prints "no problems found." and no counts line at all, so
        # the grep matched nothing and, under `bash -e`, took the whole step
        # down. The action failed precisely on the projects it had nothing
        # to say about. A scan is milliseconds; a second pass is cheaper
        # than guessing at prose.
        report="${RUNNER_TEMP}/godot-refcheck-report.txt"
        machine="${RUNNER_TEMP}/godot-refcheck-report.json"
        # shellcheck disable=SC2086
        "$binary" '${{ inputs.path }}' $args --fail-on never | tee "$report"
        # shellcheck disable=SC2086
        "$binary" '${{ inputs.path }}' $args --json --fail-on never > "$machine"
        counts="$(python3 - "$machine" <<'PY'
        import json, sys
        d = json.load(open(sys.argv[1], encoding="utf-8"))
        f = d.get("findings") or []
        n = lambda lvl: sum(1 for x in f if x.get("level") == lvl)
        print(n("error"), n("warning"), n("info"), len(d.get("repairs") or []))
        PY
        )"
        read -r errors warnings notes repaired <<< "$counts"
        errors="${errors:-0}"; warnings="${warnings:-0}"; notes="${notes:-0}"
        repaired="${repaired:-0}"
        total=$((errors + warnings + notes))
        {
          echo "errors=$errors"
          echo "warnings=$warnings"
          echo "notes=$notes"
          echo "findings=$total"
          echo "repaired=$repaired"
        } >> "$GITHUB_OUTPUT"
        {
          echo "### godot-refcheck"
          echo ""
          echo "$errors errors, $warnings warnings, $notes notes."
          echo ""
          echo '```'
          cat "$report"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        case '${{ inputs.fail-on }}' in
          never) exit 0 ;;
          info)  if [ "$total" -gt 0 ]; then exit 1; fi ;;
          warning) if [ $((errors + warnings)) -gt 0 ]; then exit 1; fi ;;
          *)     if [ "$errors" -gt 0 ]; then exit 1; fi ;;
        esac
        exit 0
