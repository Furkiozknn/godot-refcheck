name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build binaries for.
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Open a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --title "$TAG" --notes-file CHANGELOG.md
          fi

  build:
    needs: prepare
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  ext: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-latest,     target: x86_64-apple-darwin,       ext: tar.gz, cross: true }
          - { os: macos-latest,     target: aarch64-apple-darwin,      ext: tar.gz }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    ext: zip }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Toolchain
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      # Intel macOS is cross-compiled from the Apple Silicon runner, because the
      # macos-13 image is on its way out. That build cannot run its own tests on
      # the host, and every other target does.
      - name: The tests have to pass on the platform we ship
        if: ${{ !matrix.cross }}
        run: cargo test --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -eu
          name="godot-refcheck-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/godot-refcheck.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/godot-refcheck" "dist/$name/"
          fi
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          cd dist
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a -bso0 "$name.zip" "./$name/*"
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          archive="$name.${{ matrix.ext }}"
          if [ "${RUNNER_OS}" = "macOS" ]; then
            shasum -a 256 "$archive" > "$archive.sha256"
          else
            sha256sum "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          name="godot-refcheck-${TAG}-${{ matrix.target }}.${{ matrix.ext }}"
          gh release upload "$TAG" "dist/$name" "dist/$name.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Every platform is attached, so make the release visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"

  # cargo install godot-refcheck, for people who would rather not download a
  # binary. It stays switched off until the repository variable CRATES_IO is
  # set to "on", because crates.io cannot accept a trusted publisher for a
  # crate that has never been published, and a job that is certain to fail is
  # worse than no job. Once the crate exists and its trusted publisher points
  # at this workflow, flipping that variable is the whole of the setup.
  #
  # No third-party action is used here for the same reason as everywhere else
  # in this file: the OIDC exchange is three HTTP calls, and the token is
  # revoked at the end whether or not the publish succeeded.
  crates:
    needs: build
    if: vars.CRATES_IO == 'on'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: The tag and Cargo.toml have to agree
        run: |
          set -eu
          want="${TAG#v}"
          have="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$want" != "$have" ]; then
            echo "tag says $want, Cargo.toml says $have" >&2
            exit 1
          fi
          echo "both say $have"

      - name: Borrow a token from crates.io with this workflow's identity
        id: auth
        run: |
          set -eu
          jwt="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=crates.io" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')"
          token="$(curl -sS -X POST https://crates.io/api/v1/trusted_publishing/tokens \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: godot-refcheck-release' \
            -d "$(python3 -c 'import json,sys;print(json.dumps({"jwt":sys.argv[1]}))' "$jwt")" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])')"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: cargo publish --locked --token '${{ steps.auth.outputs.token }}'

      - name: Give the token back
        if: always() && steps.auth.outputs.token != ''
        run: |
          curl -sS -X DELETE https://crates.io/api/v1/trusted_publishing/tokens \
            -H 'Authorization: Bearer ${{ steps.auth.outputs.token }}' \
            -H 'User-Agent: godot-refcheck-release' >/dev/null
          echo "revoked"
