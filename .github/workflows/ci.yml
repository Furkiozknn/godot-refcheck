name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustc --version && cargo --version
      - name: Test
        shell: bash
        run: |
          set -eo pipefail
          cargo test --all-targets 2>&1 | tee test.log
          total=$(grep -oE '^test result: ok\. [0-9]+ passed' test.log \
            | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          echo "=== ${total} tests passed ==="
          if [ "${total}" -lt 1 ]; then exit 1; fi
      - name: Build
        run: cargo build --release
      - name: Check the fixtures from the command line
        shell: bash
        run: |
          set -eu
          bin=target/release/godot-refcheck
          if [ "${RUNNER_OS}" = "Windows" ]; then bin=target/release/godot-refcheck.exe; fi
          "$bin" tests/projects/clean
          "$bin" tests/projects/legacy3
          "$bin" tests/projects/tricky
          if "$bin" tests/projects/broken; then
            echo "the broken fixture should have failed the run"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  action:
    name: the action checks this repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: refcheck
        uses: ./
        with:
          path: tests/projects
          recursive: "true"
          fail-on: never
      - name: The counts have to match the fixtures
        run: |
          echo "errors=${{ steps.refcheck.outputs.errors }}"
          echo "warnings=${{ steps.refcheck.outputs.warnings }}"
          # 17 -> 19 when tests/projects/nodepath was added: that fixture
          # carries exactly two missing-node-path findings, and this step is
          # here so a change in what the fixtures report cannot pass silently.
          # Warnings 2 -> 4 with tests/projects/generated: its two uid-only
          # settings beside a git-ignored game/ are warnings by design.
          if [ "${{ steps.refcheck.outputs.errors }}" != "19" ]; then
            echo "expected 19 errors from the fixture projects"
            exit 1
          fi
          if [ "${{ steps.refcheck.outputs.warnings }}" != "4" ]; then
            echo "expected 4 warnings from the fixture projects"
            exit 1
          fi

  oracle:
    name: agree with the engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release
      - name: Compare every check with a headless Godot
        run: python3 tools/verify_with_godot.py --download

  sarif:
    name: code scanning
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          path: tests/projects
          recursive: "true"
          sarif: refcheck.sarif
          fail-on: never
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: refcheck.sarif
          category: godot-refcheck

  # tools/action_smoke.py runs action.yml's own shell against the fixtures,
  # including the install step with a stand-in for the release download. It
  # existed but ran nowhere, so the Action's download path had silently fallen
  # back to a source build on every Linux and macOS runner.
  action-smoke:
    name: the action's shell, step by step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release
      - run: python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --break-system-packages pyyaml
      - run: python3 tools/action_smoke.py target/release/godot-refcheck
