<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="godot-refcheck - finds broken resource references and dead signal connections in Godot projects, and repairs what can be proved">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#17161d"/><stop offset="58%" stop-color="#0e0d12"/><stop offset="100%" stop-color="#0b0b0f"/>
  </linearGradient>
  <linearGradient id="name" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#f2efe6"/><stop offset="62%" stop-color="#e7dcc0"/><stop offset="100%" stop-color="#c9a961"/>
  </linearGradient>
  <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#c9a961" stop-opacity="0.5"/><stop offset="100%" stop-color="#c9a961" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1200" height="250" fill="url(#bg)"/>

<text x="54" y="96" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-weight="700" font-size="52" fill="url(#name)" letter-spacing="-1">godot-refcheck</text>
<text x="56" y="132" font-family="'Segoe UI',Verdana,Helvetica,sans-serif" font-size="17" fill="#c7c2b6" opacity="0.92">Godot names a broken reference when that scene loads. A dead signal, never.</text>
<line x1="56" y1="152" x2="330" y2="152" stroke="url(#hair)" stroke-width="1.5"/>
<rect x="56" y="176" width="91" height="26" rx="13" fill="#141419" stroke="#4ade9e" stroke-opacity="0.45"/>
<text x="101" y="193" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#4ade9e">147 tests</text>
<rect x="157" y="176" width="223" height="26" rx="13" fill="#141419" stroke="#c9a961" stroke-opacity="0.45"/>
<text x="268" y="193" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#c9a961">one binary, no dependencies</text>
<rect x="390" y="176" width="120" height="26" rx="13" fill="#141419" stroke="#6cb6ff" stroke-opacity="0.45"/>
<text x="450" y="193" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" fill="#6cb6ff">Godot 3 and 4</text>
<text x="764" y="74" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#4a4a55" text-anchor="end">level:4</text>
<line x1="776" y1="60" x2="776" y2="82" stroke="#2a2a33"/>
<text x="790" y="74" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#ff5f5f">res://art/wall.png  missing</text>
<circle cx="700" cy="70" r="3" fill="#ff5f5f" filter="url(#glow)"/>
<text x="764" y="108" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#4a4a55" text-anchor="end">level:5</text>
<line x1="776" y1="94" x2="776" y2="116" stroke="#2a2a33"/>
<text x="790" y="108" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#d7d75f">res://ui/icon.png  case only</text>
<circle cx="700" cy="104" r="3" fill="#d7d75f" filter="url(#glow)"/>
<text x="764" y="142" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#4a4a55" text-anchor="end">hud:22</text>
<line x1="776" y1="128" x2="776" y2="150" stroke="#2a2a33"/>
<text x="790" y="142" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#ff5f5f">from=&quot;Panel/Gone&quot;  dropped</text>
<circle cx="700" cy="138" r="3" fill="#ff5f5f" filter="url(#glow)"/>
<text x="764" y="176" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#4a4a55" text-anchor="end">--fix</text>
<line x1="776" y1="162" x2="776" y2="184" stroke="#2a2a33"/>
<text x="790" y="176" font-family="'Cascadia Code','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#4ade9e">3 references repaired</text>
<circle cx="700" cy="172" r="3" fill="#4ade9e" filter="url(#glow)"/>
</svg>
