name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: rustc --version && cargo --version
      - name: Test
        shell: bash
        run: |
          set -eo pipefail
          cargo test --all-targets 2>&1 | tee test.log
          total=$(grep -oE '^test result: ok\. [0-9]+ passed' test.log \
            | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          echo "=== ${total} tests passed ==="
          if [ "${total}" -lt 1 ]; then exit 1; fi
      - name: Build
        run: cargo build --release
      - name: Check the fixtures from the command line
        shell: bash
        run: |
          set -eu
          bin=target/release/godot-refcheck
          if [ "${RUNNER_OS}" = "Windows" ]; then bin=target/release/godot-refcheck.exe; fi
          "$bin" tests/projects/clean
          "$bin" tests/projects/legacy3
          "$bin" tests/projects/tricky
          if "$bin" tests/projects/broken; then
            echo "the broken fixture should have failed the run"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  action:
    name: the action checks this repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: refcheck
        uses: ./
        with:
          path: tests/projects
          recursive: "true"
          fail-on: never
      - name: The counts have to match the fixtures
        run: |
          echo "errors=${{ steps.refcheck.outputs.errors }}"
          echo "warnings=${{ steps.refcheck.outputs.warnings }}"
          if [ "${{ steps.refcheck.outputs.errors }}" != "17" ]; then
            echo "expected 17 errors from the fixture projects"
            exit 1
          fi
          if [ "${{ steps.refcheck.outputs.warnings }}" != "2" ]; then
            echo "expected 2 warnings from the fixture projects"
            exit 1
          fi

  # The job above exercises one shape: many projects, findings present,
  # fail-on never. That is the shape that worked. A single project with
  # nothing wrong with it was never run, and that is the one that failed -
  # the counts were scraped out of prose a clean run does not print, so the
  # step died under `bash -e` on exactly the repositories it had nothing to
  # say about. This job runs the action's own shell against every shape.
  action-shapes:
    name: the action survives a project with nothing wrong
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: cargo build --release
      - name: Clean, broken, and every fail-on level
        run: python3 tools/action_smoke.py

      # A clean project through the real action, not a simulation of it.
      - id: clean
        uses: ./
        with:
          path: tests/projects/clean
          fail-on: error
      - name: A clean project reports zero and passes
        run: |
          set -eu
          test "${{ steps.clean.outputs.errors }}" = "0"
          test "${{ steps.clean.outputs.warnings }}" = "0"
          test "${{ steps.clean.outputs.findings }}" = "0"
          echo "clean project: 0 findings, step green"

  oracle:
    name: agree with the engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release
      - name: Compare every check with a headless Godot
        run: python3 tools/verify_with_godot.py --download

  sarif:
    name: code scanning
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          path: tests/projects
          recursive: "true"
          sarif: refcheck.sarif
          fail-on: never
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: refcheck.sarif
          category: godot-refcheck
