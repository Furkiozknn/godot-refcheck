[package]
name = "godot-refcheck"
version = "0.3.0"
edition = "2021"
rust-version = "1.74"
description = "Find broken resource references, UID problems and dead assets in Godot 3/4 projects, without opening the editor."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Furkiozknn/godot-refcheck"
homepage = "https://github.com/Furkiozknn/godot-refcheck"
keywords = ["godot", "gamedev", "linter", "static-analysis", "ci"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/fixtures", "/.github", "/docs"]

[[bin]]
name = "godot-refcheck"
path = "src/main.rs"

[lib]
name = "godot_refcheck"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
